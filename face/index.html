<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<!-- 主控伺服这个页面时会把真 token 填进来（见 xiaoyu/face/static.py），
     所以平板只要打开 http://<主机IP>:8765/ 就行，不用带任何参数 -->
<meta name="xiaoyu-token" content="">
<!-- 加到平板主屏幕后按全屏 App 起 —— 这是"去掉浏览器顶上那条"的正解 -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f7f3ec">
<link rel="icon" href="data:,">
<title>小柚子</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #f7f3ec;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  /* 脸占满整块屏，字幕和状态浮在上面 —— 平板上要像台设备，不能像张网页 */
  #wrap { position: relative; height: 100%; }
  canvas {
    position: absolute; transform: translate(-50%, -50%);
    touch-action: none; cursor: pointer; display: block;
    transition: filter .4s ease, opacity .4s ease;
  }
  /* 断线必须看得出来：脸还在画着、其实早断了，这台设备就等于瘫了（B 阶段实测踩到） */
  body.offline canvas { filter: grayscale(1) opacity(.35); }
  #caption {
    position: absolute; left: 50%; bottom: 3vh; transform: translateX(-50%);
    max-width: 86vw; text-align: center; line-height: 1.5;
    font-size: clamp(15px, 2.2vh, 28px); color: #4a443c;
  }
  #status {
    position: absolute; top: 1.6vh; right: 3vw;
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: #94897c; opacity: .55;
  }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: #d9534f; transition: background .3s; }
  #dot.on { background: #5cb85c; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="face" width="520" height="420"></canvas>
  <div id="caption"></div>
  <div id="status"><span id="dot"></span><span id="statusText">连接中……</span></div>
</div>
<script>
// ---------- 连接参数 ----------
// 主控发这个页面时会把真 token 填进 meta，所以平板直接开 http://<主机IP>:8765/ 就行。
// 想手动指定也还支持：?token=xxx&host=1.2.3.4&port=8765
const qs = new URLSearchParams(location.search);
const tokenMeta = document.querySelector('meta[name="xiaoyu-token"]');
const TOKEN = qs.get("token") || (tokenMeta && tokenMeta.content) || "xiaoyu";
const HOST = qs.get("host") || location.hostname || "localhost";
// 页面由主控自己发的时候，端口就是当前端口 —— 以后换端口不用动页面
const PORT = qs.get("port") || location.port || "8765";
const SCHEME = location.protocol === "https:" ? "wss" : "ws";

const canvas = document.getElementById("face");
const ctx = canvas.getContext("2d");
const captionEl = document.getElementById("caption");
const dotEl = document.getElementById("dot");
const statusEl = document.getElementById("statusText");

// ---------- 画布尺寸 ----------
// 这张脸是按 520x420 画的：面板、眼睛、嘴全是这个坐标系里的绝对像素。
// 所以不去重写几何，而是把整块画布缩放 —— 平板上眼睛跟着一起变大，高 DPI 也不糊。
// （原来是写死的 520x420 居中，平板上只有中间一小块，字和眼睛都显小。）
const BASE_W = 520, BASE_H = 420;
let viewScale = 1;

function resize() {
  const pad = 0.03;      // 贴边会被平板的圆角 / 黑边切到
  const band = 0.14;     // 底下留给字幕的一条带子，别压到脸上
  const availW = window.innerWidth * (1 - pad * 2);
  const availH = window.innerHeight * (1 - pad * 2 - band);
  const scale = Math.max(0.2, Math.min(availW / BASE_W, availH / BASE_H));
  const dpr = window.devicePixelRatio || 1;
  viewScale = scale * dpr;
  canvas.width = Math.round(BASE_W * viewScale);
  canvas.height = Math.round(BASE_H * viewScale);
  canvas.style.width = (BASE_W * scale) + "px";
  canvas.style.height = (BASE_H * scale) + "px";
  canvas.style.left = (window.innerWidth / 2) + "px";
  // 位置对着屏幕中心，availH 只用来限制大小 —— 竖屏时宽度才是瓶颈，
  // 按 availH 居中会让脸明显偏上（实测 800x1280 下偏了 90px）
  canvas.style.top = (window.innerHeight / 2) + "px";
}
resize();
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);

// ---------- 状态 ----------
// 表情基准：用户从 A/B/C 三版稿里选的 A 版（Vector 风 LCD 豆眼）。
// 情绪系统落地时会在这里加 mood 维度（眉眼/光环色），协议已预留 emotion 事件。
let state = "idle";        // idle / listening / thinking / speaking / error
let mouthTarget = 0;       // 主控推来的口型目标值 0~1
let mouthShown = 0;        // 平滑后的显示值
let blinkLeft = 0;         // >0 正在闭眼（帧数）
let nextBlink = 140;
let lookX = 0, lookY = 0;      // 眼睛当前偏移（待机时四处看）
let lookTargetX = 0, lookTargetY = 0;
let nextLook = 200;
// 眼睛跟随（S6a）：最近一次 gaze 事件。500ms 没新 gaze 就回待机游荡。
const GAZE_TTL = 500;
let gazeX = 0, gazeY = 0, gazeAt = 0;
// 情绪系统：最近一次 emotion 事件。12 秒后回 neutral。
const MOOD_TTL = 12000;
let mood = "neutral", moodIntensity = 0.5, moodAt = 0;

const PANEL = "#262624";
const EYE = "#F1EFE8";
const LABEL = {
  idle: "待机", listening: "听你说话", thinking: "在想",
  speaking: "在说", error: "出错了",
};

// ---------- WebSocket ----------
const RETRY_MS = 1000;     // 重连间隔（原来是 3 秒 —— 平板挂起后要等 50 多秒才接回）
const STALE_MS = 15000;    // 这么久没收到主控任何消息（含心跳）= 这条连接已经死了
let ws = null;
let retryTimer = null;
let lastMsgAt = 0;

function setOnline(on) {
  dotEl.classList.toggle("on", on);
  // 断线时把脸调灰调暗：屏幕上"还画着最新一帧"最容易骗人
  document.body.classList.toggle("offline", !on);
}

function connect() {
  if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) return;
  const url = `${SCHEME}://${HOST}:${PORT}/?token=${encodeURIComponent(TOKEN)}`;
  ws = new WebSocket(url);
  ws.onopen = () => {
    lastMsgAt = Date.now();
    setOnline(true);
    statusEl.textContent = `已连接 ${HOST}:${PORT}`;
    keepAwake();
  };
  ws.onmessage = (ev) => {
    lastMsgAt = Date.now();
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }
    if (msg.type === "tick") return;    // 心跳：只用来刷新"这条连接还活着"
    if (msg.type === "state") {
      state = LABEL[msg.state] ? msg.state : "idle";
      if (state !== "speaking") mouthTarget = 0;
      if (state === "idle") captionEl.textContent = "";
      statusEl.textContent = `已连接 · ${LABEL[state]}`;
    } else if (msg.type === "mouth") {
      mouthTarget = Math.max(0, Math.min(1, msg.level || 0));
    } else if (msg.type === "caption") {
      captionEl.textContent = msg.text || "";
    } else if (msg.type === "gaze") {
      gazeX = Math.max(-1, Math.min(1, msg.x || 0));
      gazeY = Math.max(-1, Math.min(1, msg.y || 0));
      gazeAt = Date.now();
    } else if (msg.type === "emotion") {
      const m = String(msg.mood || "neutral");
      mood = ["happy", "sad", "angry", "surprised", "neutral"].includes(m) ? m : "neutral";
      moodIntensity = Math.max(0, Math.min(1, msg.intensity || 0.5));
      moodAt = Date.now();
    }
  };
  ws.onclose = () => {
    setOnline(false);
    statusEl.textContent = "断了，重连中……";
    captionEl.textContent = "";
    state = "error";
    clearTimeout(retryTimer);
    retryTimer = setTimeout(connect, RETRY_MS);
  };
  ws.onerror = () => { try { ws.close(); } catch {} };
}
connect();

// 平板把浏览器挂起时，JS 定时器跟着一起冻住 —— 醒来时那个"3 秒后重连"早过期了。
// 所以每次页面重新可见 / 网络恢复，都主动踢一脚，不等定时器。
function poke() {
  if (!ws || ws.readyState === WebSocket.CLOSED || ws.readyState === WebSocket.CLOSING) connect();
}

// 平板常亮。注意 navigator.wakeLock 要求安全上下文（https 或 localhost）：
// 平板上用 http://192.168.x.x 打开时它直接失效，屏幕会自己熄 ——
// 所以平板的息屏设置必须改成"永不"（或换 Fully Kiosk 这类自带常亮的浏览器）。
function keepAwake() {
  if (!("wakeLock" in navigator)) return;
  navigator.wakeLock.request("screen").catch(() => {});
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { resize(); keepAwake(); poke(); }
});
window.addEventListener("online", poke);
window.addEventListener("focus", poke);

// 点脸 = 打断（说的时候点才有意义，主控自己判断）
canvas.addEventListener("pointerdown", () => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "interrupt" }));
  }
});

// ---------- 工具 ----------
// 圆角 bean（Vector 的眼睛）。参数 y 是眼睛的**中心**，不是上边缘。
// 拆成「只画路径」和「填色」两步，是为了两只眼睛攒成一条路径一次填完 ——
// 加外发光时 shadowBlur 只算一遍（这个操作很贵）。
function beanPath(x, y, w, h) {
  const r = w / 2;
  ctx.moveTo(x, y - h / 2 + r);
  ctx.arcTo(x, y - h / 2, x + w, y - h / 2, r);
  ctx.arcTo(x + w, y - h / 2, x + w, y + h / 2, r);
  ctx.arcTo(x + w, y + h / 2, x, y + h / 2, r);
  ctx.arcTo(x, y + h / 2, x, y - h / 2, r);
  ctx.closePath();
}
function bean(x, y, w, h) {
  ctx.beginPath();
  beanPath(x, y, w, h);
  ctx.fill();
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// 情绪的固定嘴形：smile 上弯 / frown 下弯 / o 小圆口。
// 曲线中心比嘴角低就是 "U"（笑），反过来就是撇嘴。
function drawMouth(kind, x, y, k) {
  const t = 0.55 + 0.45 * k;          // 强度：越强嘴越大
  ctx.save();
  ctx.strokeStyle = EYE;
  ctx.fillStyle = EYE;
  ctx.lineCap = "round";
  if (kind === "o") {
    ctx.beginPath();
    ctx.ellipse(x, y - 2, 9 * t, 12 * t, 0, 0, Math.PI * 2);
    ctx.fill();
  } else if (kind === "soft") {
    // 静止时的一条浅弧：只求"有张脸"，不求表达情绪，所以更短更淡
    ctx.strokeStyle = "rgba(241,239,232,0.42)";
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(x - 14, y - 2);
    ctx.quadraticCurveTo(x, y + 5, x + 14, y - 2);
    ctx.stroke();
  } else {
    const w = 26 * t;
    const d = 12 * t * (kind === "smile" ? 1 : -1);
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(x - w, y - d * 0.5);
    ctx.quadraticCurveTo(x, y + d, x + w, y - d * 0.5);
    ctx.stroke();
  }
  ctx.restore();
}
const MOUTH = { happy: "smile", angry: "frown", sad: "frown", surprised: "o" };

// ---------- 画脸 ----------
function draw() {
  // 画布可能被缩放过（平板 / 高 DPI），这里把坐标系复位回 520x420 的设计尺寸 ——
  // 下面的几何全是按它写死的
  ctx.setTransform(viewScale, 0, 0, viewScale, 0, 0);
  const W = BASE_W, H = BASE_H;
  const cx = W / 2, cy = H / 2 - 10;
  ctx.clearRect(0, 0, W, H);

  // 假死检测：主控每 5 秒一个心跳，超过 15 秒没消息就当它断了。
  // 以前这种情况屏幕上看不出来 —— 脸还在动，其实早就不连了。
  if (ws && ws.readyState === WebSocket.OPEN && lastMsgAt &&
      Date.now() - lastMsgAt > STALE_MS) {
    setOnline(false);
    statusEl.textContent = "连接卡住了，重连中……";
    state = "error";
    try { ws.close(); } catch {}
  }

  // 呼吸：待机时整张脸轻轻起伏
  const breathe = state === "idle" ? 1 + Math.sin(Date.now() / 900) * 0.006 : 1;

  // 屏幕面板（深色圆角矩形，像 Vector 的脸屏）
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(breathe, breathe);
  ctx.translate(-cx, -cy);
  rr(56, 36, W - 112, H - 72, 42);
  ctx.fillStyle = PANEL;
  ctx.fill();

  // 情绪（m）：12 秒内有效，过期回 neutral。强度 k 控制光环/腮红的浓度。
  const moodFresh = Date.now() - moodAt < MOOD_TTL;
  const m = moodFresh ? mood : "neutral";
  const k = moodFresh ? moodIntensity : 0;

  // 情绪光环：脸屏外圈一圈情绪色的辉光（开心暖金 / 难过蓝灰 / 生气红 / 惊讶青）
  const HALO = {
    happy: "rgba(224,168,74,", sad: "rgba(110,126,160,",
    angry: "rgba(196,64,48,", surprised: "rgba(72,166,164,",
  };
  if (HALO[m] && k > 0.05) {
    ctx.save();
    ctx.shadowColor = HALO[m] + 0.55 * k + ")";
    ctx.shadowBlur = 40 * k * viewScale;   // 同上：光环也要跟着缩放
    rr(60, 40, W - 120, H - 80, 38);
    ctx.strokeStyle = HALO[m] + 0.8 * k + ")";
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.restore();
  }

  // 眼睛参数
  let eyeW = 56, eyeH = 84;
  if (state === "listening") eyeH = 96;          // 听你说话：睁大一点
  if (state === "thinking") { eyeH = 70; lookTargetY = -16; }  // 在想：眼睛往上瞟
  if (state === "speaking") eyeH = 84 + mouthShown * 6;        // 说话：随语气轻轻跳
  if (m === "surprised") { eyeW *= 1.15; eyeH *= 1.3; }        // 惊讶：瞪圆
  if (m === "angry") { eyeH *= 0.7; }                          // 生气：锐眼
  if (m === "sad") { eyeH *= 0.65; }                           // 难过：垂眼
  if (m === "happy") { eyeH *= 0.8; }                          // 开心：眼角弯下去前先把眼皮放矮

  // 眼睛目标优先级（S6a）：gaze 跟随 > 待机游荡。
  // 待机/听话时 500ms 内有 gaze 就盯着人看；超时或人不见了回游荡。
  const gazeFresh = (state === "idle" || state === "listening") &&
                    Date.now() - gazeAt < GAZE_TTL;
  if (gazeFresh) {
    lookTargetX = gazeX * 26;    // gaze.x 已经是"该往屏幕哪边看"（+ = 右边），直接用
    lookTargetY = -gazeY * 16;   // 画面上方是正 y，屏幕偏移向上是负
  } else if (state === "idle" && --nextLook <= 0) {
    // 待机时眼睛四处看（Vector 的招牌动作）
    const dirs = [[-16, 0], [16, 0], [0, -10], [0, 6], [0, 0]];
    const d = dirs[Math.floor(Math.random() * dirs.length)];
    lookTargetX = d[0]; lookTargetY = d[1];
    nextLook = 160 + Math.random() * 200;
  }
  // 难过：视线略垂。必须是固定偏移；写成 lookTargetY += 5 会每帧累加，
  // 几秒内把眼睛顶出脸外（实测 3 秒跑到 cy+858）。
  const dropY = m === "sad" ? 6 : 0;
  lookX += (lookTargetX - lookX) * 0.08;
  lookY += (lookTargetY + dropY - lookY) * 0.08;

  // 眨眼
  if (--nextBlink <= 0) { blinkLeft = 7; nextBlink = 150 + Math.random() * 180; }
  if (blinkLeft > 0) { blinkLeft--; eyeH *= 0.08; }

  // 眉毛：生气倒眉 / 难过八字眉 / 惊讶挑眉
  if (m === "angry" || m === "sad" || m === "surprised") {
    ctx.strokeStyle = EYE;
    ctx.lineWidth = 5;
    ctx.lineCap = "round";
    const browY = cy - eyeH / 2 - 20;
    // 左眉：angry 外高内低；sad 外低内高；surprised 整体抬高
    const lo = m === "angry" ? -12 : m === "sad" ? 8 : 0;
    const li = m === "angry" ? 12 : m === "sad" ? -8 : 0;
    const lift = m === "surprised" ? -9 * k : 0;
    ctx.beginPath();
    ctx.moveTo(cx - 58 - eyeW / 2 - 8, browY + lift + lo);
    ctx.lineTo(cx - 58 + eyeW / 2 + 8, browY + lift + li);
    ctx.stroke();
    ctx.beginPath();   // 右眉镜像
    ctx.moveTo(cx + 58 + eyeW / 2 + 8, browY + lift + lo);
    ctx.lineTo(cx + 58 - eyeW / 2 - 8, browY + lift + li);
    ctx.stroke();
  }

  // 画眼：两只眼睛合成一条路径 + 一层柔光，做出 LCD 背光的感觉。
  // （beanPath 的参数是眼睛的**中心** y，不是上边缘。）
  const ex = cx - eyeW / 2, ey = cy;
  ctx.save();
  ctx.shadowColor = "rgba(241,239,232,0.38)";   // 别太散，散过头豆眼会显糊
  ctx.shadowBlur = 14 * viewScale;   // 阴影不吃画布缩放，得自己乘回去
  ctx.fillStyle = EYE;
  ctx.beginPath();
  beanPath(ex - 58 + lookX, ey + lookY, eyeW, eyeH);
  beanPath(ex + 58 + lookX, ey + lookY, eyeW, eyeH);
  ctx.fill();
  ctx.restore();

  // 开心：用面板色盖住 bean 的下缘，豆眼变弯月眼（Vector 笑眼）
  if (m === "happy") {
    ctx.fillStyle = PANEL;
    ctx.beginPath();
    ctx.ellipse(cx - 58 + lookX, cy + lookY + eyeH * 0.5, eyeW * 0.85, eyeH * 0.45, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + 58 + lookX, cy + lookY + eyeH * 0.5, eyeW * 0.85, eyeH * 0.45, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // 开心腮红
  if (m === "happy" && k > 0.1) {
    ctx.fillStyle = "rgba(233,120,120," + 0.35 * k + ")";
    ctx.beginPath();
    ctx.ellipse(cx - 96, cy + 44, 16, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + 96, cy + 44, 16, 9, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // 嘴：说话时跟音量开合；情绪时给一张固定的嘴
  // （以前怒/悲/惊只有眉毛在撑，嘴巴空着，情绪只表达了一半）
  mouthShown += (mouthTarget - mouthShown) * 0.4;
  const mouthY = cy + 100;
  if (mouthShown > 0.03) {
    ctx.save();
    ctx.fillStyle = EYE;   // 必须显式指定：不写会继承上面腮红/挖月牙的颜色，说话时嘴就隐形了
    ctx.beginPath();
    ctx.ellipse(cx + lookX * 0.4, mouthY, 24, 3 + mouthShown * 24, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  } else if (MOUTH[m]) {
    drawMouth(MOUTH[m], cx + lookX * 0.4, mouthY, k);
  } else if (state !== "error") {
    // 待机/听话/思考都留一条浅弧，别让静止的脸空着（error 时不画 ）
    drawMouth("soft", cx + lookX * 0.4, mouthY, 0.5);
  }

  ctx.restore();
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
